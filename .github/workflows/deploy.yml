name: Deploy to GCP Compute Engine

# Builds and runs the whole stack (Kafka, authoritative, command, web, Caddy)
# on a single GCE VM with Docker Compose. Same shape as tandem's deploy:
# inject secrets → keyless auth via Workload Identity Federation → scp the
# checkout to the VM → `docker compose up -d --build` over ssh.
#
# ── One-time setup ────────────────────────────────────────────────────────────
#  1. GCE VM (e2-medium or bigger — Kafka wants ~1 GB RAM on its own) running a
#     Debian/Ubuntu image with Docker Engine + the compose plugin installed.
#     Open firewall: tcp:80,443 (Caddy), tcp:8080 (robot WebSocket),
#     tcp:8082 + udp:8081 (command relay).
#  2. DNS A record for DOMAIN_NAME (and www.) → the VM's static external IP.
#  3. Workload Identity Federation so Actions can auth without a JSON key:
#       gcloud iam workload-identity-pools create github --location=global
#       gcloud iam workload-identity-pools providers create-oidc github \
#         --location=global --workload-identity-pool=github \
#         --issuer-uri="https://token.actions.githubusercontent.com" \
#         --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#         --attribute-condition="assertion.repository=='WUSTL-Delivery/delivery-gdg-platform'"
#     Then a service account with roles/compute.instanceAdmin.v1 and
#     roles/iam.serviceAccountUser, bound to the pool via
#     roles/iam.workloadIdentityUser.
#  4. Repo → Settings → Environments → create `prod`, add these secrets:
#       GCP_PROJECT, GCP_ZONE, GCP_VM_NAME, GCP_SA_EMAIL, WIF_PROVIDER
#         (WIF_PROVIDER looks like
#          projects/123456/locations/global/workloadIdentityPools/github/providers/github)
#       SUPABASE_URL, SUPABASE_SECRET_KEY, JWT_SECRET, DOMAIN_NAME
#       FLEET_ENROLL_KEY  — the fleet enrollment key, generated by you
#                           (openssl rand -hex 24). fleet-server seeds it on start;
#                           fleet-bridge and the robots enroll with it.
#     Optional:
#       GHCR_READ_TOKEN   — only if the fleet-server package on GHCR is private
#                           (a classic PAT with read:packages, or make the package public)
#  5. DNS: also add an A record for fleet.DOMAIN_NAME → the same VM. Caddy
#     provisions its cert and proxies wss://fleet.<domain>/ws to fleet-server.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys race on the VM.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/delivery-gdg

jobs:
  # Gate: refuse to ship a dependency with a known critical vulnerability.
  # Added after the 2026-09-04 incident, where Next.js 15.5.3 (public RCE,
  # GHSA-9qr9-h5gf-34mp) was deployed and the web container was compromised
  # within two hours. Fails the run before anything is copied to the VM.
  check:
    name: Dependency vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/web/package-lock.json

      - name: npm audit (web, production deps, critical)
        working-directory: apps/client/web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=critical

      - name: npm audit + typecheck (fleet-bridge)
        working-directory: apps/fleet-bridge
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=critical
          npm run typecheck

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            apps/authoritative/go.sum
            apps/command/go.sum

      - name: govulncheck (authoritative)
        working-directory: apps/authoritative
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: govulncheck (command)
        working-directory: apps/command
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  deploy:
    name: Build and Deploy
    needs: check
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Generate deployments/.env from GitHub Secrets. Compose reads it from
      #    the compose file's directory, and the `${VAR:?}` guards in the
      #    compose files fail fast if any is missing.
      - name: Inject secrets to deployments/.env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          FLEET_ENROLL_KEY: ${{ secrets.FLEET_ENROLL_KEY }}
        run: |
          for v in SUPABASE_URL SUPABASE_SECRET_KEY JWT_SECRET DOMAIN_NAME FLEET_ENROLL_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not set in the 'prod' environment"
              exit 1
            fi
          done
          cat <<EOT > deployments/.env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY
          JWT_SECRET=$JWT_SECRET
          DOMAIN_NAME=$DOMAIN_NAME
          FLEET_ENROLL_KEY=$FLEET_ENROLL_KEY
          EOT

      - name: Clean up for transfer
        run: rm -rf .git docs assets apps/client/mobile

      # 2. Keyless authentication via Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Copy the checkout to the VM. The deploy dir is wiped first: scp only
      #    adds/overwrites, never deletes, so a file removed from the repo would
      #    otherwise linger and still be compiled (Go builds every .go in a
      #    package dir). All real state lives in named Docker volumes
      #    (kafka-data, caddy_data), so wiping the checkout is safe. Caddyfile is
      #    bind-mounted into the running caddy container, so keep it and let scp
      #    overwrite in place (preserving the inode).
      - name: Copy files to VM
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT }} \
            --command="sudo mkdir -p $DEPLOY_DIR/deployments \
              && sudo find $DEPLOY_DIR -mindepth 1 -maxdepth 1 ! -name deployments -exec rm -rf {} + \
              && sudo find $DEPLOY_DIR/deployments -mindepth 1 -maxdepth 1 ! -name Caddyfile -exec rm -rf {} + \
              && sudo chown -R \$(whoami) $DEPLOY_DIR"

          shopt -s dotglob
          gcloud compute scp --recurse * ${{ secrets.GCP_VM_NAME }}:$DEPLOY_DIR/ \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT }}

      # 3b. Only needed while the fleet-server image on GHCR is private.
      - name: Log the VM in to GHCR (optional)
        if: ${{ secrets.GHCR_READ_TOKEN != '' }}
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT }} \
            --command="echo '$GHCR_READ_TOKEN' | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      # 4. Build + (re)start on the VM. `pull --ignore-buildable` fetches the
      #    pinned fleet-server image; --build covers everything else.
      - name: Execute deployment via ssh
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT }} \
            --command="
              set -eo pipefail
              cd $DEPLOY_DIR/deployments
              COMPOSE='sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml'

              # Reclaim disk BEFORE building so a full disk can't wedge the
              # build. Running containers protect their images; named volumes
              # (kafka-data, caddy_data TLS certs) are never touched (no --volumes).
              echo '→ Disk before cleanup:'; df -h / | tail -1
              sudo docker container prune -f
              sudo docker image prune -af
              sudo docker builder prune -af
              echo '→ Disk after cleanup:'; df -h / | tail -1

              echo '→ Pulling third-party images (kafka, kafka-ui, caddy, fleet-server)...'
              \$COMPOSE pull --ignore-buildable

              echo '→ Building and starting services...'
              \$COMPOSE up -d --build --remove-orphans

              # Caddyfile is bind-mounted; a content change alone never restarts
              # Caddy, so reload explicitly.
              echo '→ Reloading Caddy...'
              \$COMPOSE exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

              echo '→ Pruning images orphaned by this build...'
              sudo docker image prune -f

              echo '→ Status:'
              \$COMPOSE ps
            "
